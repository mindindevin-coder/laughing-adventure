<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECRET_STATION</title>
    <style>
        body { background: #000; color: #0f0; font-family: "Courier New", monospace; margin: 0; padding: 10px; }
        .win { border: 1px solid #0f0; max-width: 400px; margin: 0 auto; background: #050505; }
        .hdr { background: #0f0; color: #000; font-weight: bold; padding: 2px 5px; text-align: center; }
        #box { height: 300px; overflow-y: scroll; padding: 10px; border-bottom: 1px solid #0f0; font-size: 12px; }
        .my { color: #fff; } /* Мои сообщения белые */
        .other { color: #0f0; } /* Собеседник зеленый */
        input { background: #000; border: 1px solid #0f0; color: #0f0; padding: 5px; font-family: monospace; }
        .btn { background: #0f0; color: #000; border: none; cursor: pointer; font-weight: bold; padding: 5px; }
        #contact-bar { padding: 5px; border-bottom: 1px solid #0f0; background: #0a0a0a; }
    </style>
</head>
<body>

<div class="win">
    <div class="hdr">SECRET COMMUNICATION SYSTEM v1.0</div>
    
    <div id="auth" style="padding: 20px; text-align: center;">
        LOGIN: <input type="text" id="u" style="width:100px"><br><br>
        PASS:  <input type="password" id="p" style="width:100px"><br><br>
        <button class="btn" onclick="app.login()">ENTER SYSTEM</button>
    </div>

    <div id="main" style="display:none;">
        <div id="contact-bar">
            КОМУ (НИК): <input type="text" id="target" style="width:80px">
            <button class="btn" onclick="app.startChat()">CONNECT</button>
        </div>
        <div id="box"></div>
        <div style="padding: 5px;">
            <input type="text" id="msg" style="width:75%" placeholder="Type secret msg...">
            <button class="btn" onclick="app.send()">SEND</button>
        </div>
    </div>
</div>

<script>
    var dbUrl = "https://ple7-edit-v1-default-rtdb.europe-west1.firebasedatabase.app/";
    var app = {
        me: "", 
        to: "",
        room: "",

        login: function() {
            var u = document.getElementById('u').value.trim();
            var p = document.getElementById('p').value.trim();
            if(!u || !p) return;
            
            // Простая проверка профиля (как в прошлом коде)
            fetch(dbUrl + "profiles/" + u + ".json").then(r => r.json()).then(data => {
                if(data && data.pw !== p) { alert("ACCESS DENIED"); return; }
                if(!data) fetch(dbUrl + "profiles/" + u + ".json", {method:'PUT', body: JSON.stringify({pw:p})});
                
                this.me = u;
                document.getElementById('auth').style.display = 'none';
                document.getElementById('main').style.display = 'block';
                document.title = "AGENT: " + u;
            });
        },

        startChat: function() {
            this.to = document.getElementById('target').value.trim();
            if(!this.to) return;
            // Генерируем уникальный ID комнаты (сортируем ники по алфавиту)
            var ids = [this.me, this.to].sort();
            this.room = ids[0] + "_" + ids[1];
            document.getElementById('box').innerHTML = "--- SECURE CHANNEL ESTABLISHED WITH " + this.to + " ---";
            this.load();
            if(this.timer) clearInterval(this.timer);
            this.timer = setInterval(() => this.load(), 5000);
        },

        load: function() {
            if(!this.room) return;
            fetch(dbUrl + "chats/" + this.room + ".json").then(r => r.json()).then(data => {
                var b = document.getElementById('box');
                b.innerHTML = "";
                for(var id in data) {
                    var m = data[id];
                    var cls = m.u === this.me ? "my" : "other";
                    b.innerHTML += '<div class="'+cls+'">['+m.u+']: '+m.m+'</div>';
                }
                b.scrollTop = b.scrollHeight;
            });
        },

        send: function() {
            var m = document.getElementById('msg').value;
            if(!m || !this.room) return;
            fetch(dbUrl + "chats/" + this.room + ".json", {
                method: 'POST',
                body: JSON.stringify({u: this.me, m: m, t: Date.now()})
            }).then(() => {
                document.getElementById('msg').value = "";
                this.load();
            });
        }
    };
</script>
</body>
</html>
